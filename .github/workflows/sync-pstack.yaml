name: Sync pstack upstream

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: sync-pstack
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      failed: ${{ steps.update.outcome == 'failure' }}
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - run: bun install --frozen-lockfile

      - name: Sync and verify upstream
        id: update
        continue-on-error: true
        working-directory: packages/opencode-pstack
        run: |
          mkdir -p "$RUNNER_TEMP/pstack-sync"
          {
            bun run sync &&
            bun run sync:check --remote &&
            bun run build &&
            bun run test &&
            bun run check:pack &&
            git add -- . &&
            (cd ../.. && mise exec -- hk check --check --no-fail-fast --staged)
          } 2>&1 | tee "$RUNNER_TEMP/pstack-sync/sync.log"

      - name: Capture upstream patch
        id: patch
        run: |
          mkdir -p "$RUNNER_TEMP/pstack-sync"
          git add -N -- packages/opencode-pstack
          git diff --binary HEAD -- packages/opencode-pstack > "$RUNNER_TEMP/pstack-sync/update.patch"
          if [ -s "$RUNNER_TEMP/pstack-sync/update.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pstack-sync
          path: ${{ runner.temp }}/pstack-sync/
          retention-days: 7

      - name: Explain failed sync
        if: steps.update.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          The upstream update failed verification. Download the `pstack-sync` artifact for the patch and log.

          Automatic repair requires repository variable `PSTACK_CODEX_REPAIR=true` and secret `OPENAI_API_KEY`; it uses the OpenAI API through the official Codex action.

          For Codex cloud, apply the patch to a branch and open a draft PR, then have a maintainer comment `@codex fix the pstack upstream sync and CI failures`. The repository must be connected to Codex. Bot comments are not assumed to trigger cloud tasks.
          EOF
          exit 1

  repair:
    needs: sync
    if: >-
      always() && !cancelled() && needs.sync.outputs.failed == 'true' && vars.PSTACK_CODEX_REPAIR == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pstack-sync
          path: ${{ runner.temp }}/pstack-sync

      - run: bun install --frozen-lockfile

      - name: Restore failed update
        run: |
          if [ -s "$RUNNER_TEMP/pstack-sync/update.patch" ]; then
            git apply "$RUNNER_TEMP/pstack-sync/update.patch"
          fi

      - name: Repair upstream compatibility
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        timeout-minutes: 20
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/pstack-sync-repair.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      - name: Capture repair patch
        run: |
          git add -N .
          git diff --binary HEAD > "$RUNNER_TEMP/pstack-sync/update.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pstack-repair
          path: ${{ runner.temp }}/pstack-sync/
          retention-days: 7

  pull-request:
    needs: [sync, repair]
    if: >-
      always() && !cancelled() && ((needs.sync.result == 'success' && needs.sync.outputs.failed == 'false' && needs.sync.outputs.changed == 'true') ||
       needs.repair.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.repair.result == 'success' && 'pstack-repair' || 'pstack-sync' }}
          path: ${{ runner.temp }}/pstack-sync

      - name: Apply and restrict update
        run: |
          if [ ! -s "$RUNNER_TEMP/pstack-sync/update.patch" ]; then
            echo "No update patch was produced." >&2
            exit 1
          fi
          git apply --index "$RUNNER_TEMP/pstack-sync/update.patch"
          while IFS= read -r -d '' path; do
            case "$path" in
              packages/opencode-pstack/src/*|packages/opencode-pstack/vendor/*|packages/opencode-pstack/test/*|packages/opencode-pstack/scripts/sync-pstack-upstream.mjs|packages/opencode-pstack/upstream-lock.json|packages/opencode-pstack/README.md) ;;
              *) echo "Update touched a disallowed path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only --no-renames -z)
          while IFS= read -r -d '' entry; do
            case "${entry%% *}" in
              100644|100755) ;;
              *) echo "Update contains a symlink or unsupported Git mode: $entry" >&2; exit 1 ;;
            esac
          done < <(git ls-files --stage -z -- packages/opencode-pstack)

      - run: bun install --frozen-lockfile

      - name: Lint proposed update
        run: mise exec -- hk check --check --no-fail-fast --staged

      - name: Verify proposed update independently
        working-directory: packages/opencode-pstack
        run: |
          bun run sync:check --remote
          bun run build
          bun run test
          bun run check:pack

      - name: Open upstream update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/sync-pstack
          commit-message: "chore(pstack): sync upstream"
          title: "chore(pstack): sync upstream"
          body: |
            Updates the bundled pstack snapshot from cursor/plugins.

            The workflow independently verified snapshot consistency, build, tests, and package contents before opening this PR. If automatic repair was enabled, the proposed changes may include a Codex-generated compatibility fix.

            Review the upstream changes and any compatibility edits before merging. GitHub does not start other workflows for PRs created with `GITHUB_TOKEN`.
          add-paths: packages/opencode-pstack/
