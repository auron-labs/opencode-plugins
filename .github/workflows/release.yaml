name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      package:
        description: Package path to publish
        required: true
        type: choice
        options:
          - packages/opencode-impeccable
          - packages/opencode-improve
          - packages/opencode-worktrunk
          - packages/opencode-bashkit

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - uses: dtolnay/rust-toolchain@1.99.0
        if: ${{ matrix.package == 'packages/opencode-bashkit' }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build package
        working-directory: ${{ matrix.package }}
        run: bun run build

      - name: Test package
        working-directory: ${{ matrix.package }}
        run: bun run test

      - name: Verify Impeccable snapshot
        if: ${{ matrix.package == 'packages/opencode-impeccable' }}
        working-directory: ${{ matrix.package }}
        run: bun run sync:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify Impeccable package contents
        if: ${{ matrix.package == 'packages/opencode-impeccable' }}
        working-directory: ${{ matrix.package }}
        run: bun run check:pack

      - name: Publish to npm
        working-directory: ${{ matrix.package }}
        run: npm publish --access public

  publish-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - uses: dtolnay/rust-toolchain@1.99.0
        if: ${{ inputs.package == 'packages/opencode-bashkit' }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build package
        working-directory: ${{ inputs.package }}
        run: bun run build

      - name: Test package
        working-directory: ${{ inputs.package }}
        run: bun run test

      - name: Verify Impeccable snapshot
        if: ${{ inputs.package == 'packages/opencode-impeccable' }}
        working-directory: ${{ inputs.package }}
        run: bun run sync:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify Impeccable package contents
        if: ${{ inputs.package == 'packages/opencode-impeccable' }}
        working-directory: ${{ inputs.package }}
        run: bun run check:pack

      - name: Publish to npm
        working-directory: ${{ inputs.package }}
        run: npm publish --access public
