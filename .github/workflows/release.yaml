name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      package:
        description: Package path to publish
        required: true
        type: choice
        options:
          - packages/opencode-codebase-memory
          - packages/opencode-gortex
          - packages/opencode-impeccable
          - packages/opencode-improve
          - packages/opencode-worktrunk
          - packages/opencode-bashkit

permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        if: ${{ matrix.package == 'packages/opencode-bashkit' }}
        with:
          toolchain: 1.99.0

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build package
        working-directory: ${{ matrix.package }}
        run: bun run build

      - name: Test package
        working-directory: ${{ matrix.package }}
        run: bun run test

      - name: Verify Impeccable snapshot
        if: ${{ matrix.package == 'packages/opencode-impeccable' }}
        working-directory: ${{ matrix.package }}
        run: bun run sync:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify Impeccable package contents
        if: ${{ matrix.package == 'packages/opencode-impeccable' }}
        working-directory: ${{ matrix.package }}
        run: bun run check:pack

      - name: Publish to npm
        working-directory: ${{ matrix.package }}
        run: npm publish --access public

  publish-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        if: ${{ inputs.package == 'packages/opencode-bashkit' }}
        with:
          toolchain: 1.99.0

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build package
        working-directory: ${{ inputs.package }}
        run: bun run build

      - name: Test package
        working-directory: ${{ inputs.package }}
        run: bun run test

      - name: Verify Impeccable snapshot
        if: ${{ inputs.package == 'packages/opencode-impeccable' }}
        working-directory: ${{ inputs.package }}
        run: bun run sync:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify Impeccable package contents
        if: ${{ inputs.package == 'packages/opencode-impeccable' }}
        working-directory: ${{ inputs.package }}
        run: bun run check:pack

      - name: Publish to npm
        working-directory: ${{ inputs.package }}
        run: npm publish --access public
