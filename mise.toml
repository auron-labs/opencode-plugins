[tools]
bun = "1.2.23"
node = "24"
rust = "1.99.0"

[tasks.lint]
description = "Run zero-config source lint"
run = "bash -c 'targets=(); for target in install.ts provider plugins packages; do [ -e \"$target\" ] && targets+=(\"$target\"); done; bunx oxlint --ignore-pattern \"packages/*/vendor/**\" \"${targets[@]}\"'"

[tasks.check]
description = "Run all workspace validation checks"
run = "bun run check"
depends = ["lint"]
