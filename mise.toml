[tools]
betterleaks = "1.9.0"
bun = "1.4.3"
hk = "2.5.0"
node = "26.11.1"
"npm:sort-package-json" = "4.0.0"
pinact = "5.0.0"
pkl = "0.32.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.8.0"
zizmor = "1.30.1"

[tasks.lint]
description = "Run hk check"
run = "hk check --no-fail-fast"

[tasks.fix]
description = "run hk fix"
run = "hk fix --no-fail-fast"

[tasks.build]
description = "Build all packages"
run = "bun run --filter '*' build"

[tasks.test]
description = "Runs all packages tests"
run = ["bun run --filter '*' test", "node --test scripts/opencode-smoke.test.mjs scripts/sync-improve-upstream.test.mjs"]

[tasks.readme]
description = "sync the readme with the package list"
run = "bun run scripts/update-readme.ts"

[tasks."sync:improve"]
description = "sync improve upstream improve with local package"
run = "bun run scripts/sync-improve-upstream.ts"

[env]
BETTERLEAKS_CONFIG = "{{ config_root }}/.betterleaks.toml"

[env._]
path = "{{config_root}}/node_modules/.bin"
