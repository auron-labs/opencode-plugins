# Only the source digest for the Sentry reference is exempt from this rule.
filter = '''
finding["rule_id"] == "sentry-access-token" &&
filter.matchesAny(attributes["path"], ["(^|/)packages/opencode-pstack/upstream-lock[.]json$"]) &&
filter.containsAny(finding["line"], ["skills/why/references/sources/sentry.md"]) &&
filter.matchesAny(finding["secret"], ["^[a-f0-9]{64}$"])
'''

[extend]
useDefault = true

# Limit the exemption to passwords used as test fixtures; other secret rules
# continue to scan these files.
[[allowlists]]
targetRules = ["generic-password"]
paths = [
  "^tests/",
  '\.(?:test|spec)\.(?:js|jsx|ts|tsx|mjs|cjs|mts|cts)$',
  "(?:^|/)__tests__/",
]
